name: Apply home sections read fix

on:
  push:
    branches:
      - fix/home-sections-read-amplification

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-sections-read-amplification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refactor home section resolution
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('convex/homeSections.ts')
          source = path.read_text()

          replacement = '''type ResolutionData = {
            products: ProductDoc[];
            categories: CategoryDoc[];
            promotions: PromotionDoc[];
            stores: StoreDoc[];
            skus: SkuDoc[];
            inventory: InventoryDoc[];
          };

          function requiredResolutionTables(sections: HomeSectionDoc[]) {
            const required = new Set<keyof ResolutionData>();
            for (const section of sections) {
              const refs = referencedIds(section);
              if (productSectionKinds.has(section.kind)) required.add("products");
              if (refs.categoryIds.length) required.add("categories");
              if (refs.promotionIds.length) required.add("promotions");
              if (refs.storeIds.length) required.add("stores");
            }
            return required;
          }

          async function loadResolutionData(
            ctx: { db: any },
            sections: HomeSectionDoc[],
            storeId?: string,
          ): Promise<ResolutionData> {
            const required = requiredResolutionTables(sections);
            if (storeId && sections.some((section) => productSectionKinds.has(section.kind))) {
              required.add("skus");
              required.add("inventory");
            }
            if (sections.some((section) => section.kind === "store_inventory_section")) {
              required.add("inventory");
            }

            const load = async <T>(table: keyof ResolutionData): Promise<T[]> =>
              required.has(table) ? await ctx.db.query(table).collect() as T[] : [];
            const [products, categories, promotions, stores, skus, inventory] = await Promise.all([
              load<ProductDoc>("products"),
              load<CategoryDoc>("categories"),
              load<PromotionDoc>("promotions"),
              load<StoreDoc>("stores"),
              load<SkuDoc>("skus"),
              load<InventoryDoc>("inventory"),
            ]);
            return { products, categories, promotions, stores, skus, inventory };
          }

          async function resolveSection(
            section: HomeSectionDoc,
            args: { store_id?: string; now?: number },
            data: ResolutionData,
          ) {
            const refs = referencedIds(section);
            const current = args.now ?? Date.now();
            const maxItems = sectionLimit(section);
            const { products, categories, promotions, stores, skus, inventory } = data;'''

          pattern = r'async function resolveSection\(\n  ctx: \{ db: any \},\n  section: HomeSectionDoc,\n  args: \{ store_id\?: string; now\?: number \},\n\) \{\n  const refs = referencedIds\(section\);\n  const current = args\.now \?\? Date\.now\(\);\n  const maxItems = sectionLimit\(section\);\n  const \[products, categories, promotions, stores, skus, inventory\] = await Promise\.all\(\[.*?\n  \]\);'
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1: raise SystemExit('resolveSection target did not match')

          pattern = r'async function responseForSection\(\n  ctx: \{ db: any \},\n  section: HomeSectionDoc,\n  args: \{ store_id\?: string; now\?: number \},\n\) \{\n  const normalized = normalizeSection\(section\);\n  const resolvedData = \(normalized\.resolvedData \?\? await resolveSection\(ctx, normalized, args\)\) as ResolvedSectionData;'
          replacement = '''async function responseForSection(
            section: HomeSectionDoc,
            args: { store_id?: string; now?: number },
            data: ResolutionData,
          ) {
            const normalized = normalizeSection(section);
            const resolvedData = (normalized.resolvedData ?? await resolveSection(normalized, args, data)) as ResolvedSectionData;'''
          source, count = re.subn(pattern, replacement, source, count=1)
          if count != 1: raise SystemExit('responseForSection target did not match')

          source, count = source.replace(
            '  const visibleResponses = [];\n  for (const section of sections) {\n    const response = await responseForSection(ctx, section, args);',
            '  const resolutionData = await loadResolutionData(ctx, sections, args.store_id);\n  const visibleResponses = [];\n  for (const section of sections) {\n    const response = await responseForSection(section, args, resolutionData);',
            1,
          ), 1

          old = '    if (!section) throw new Error("Home section not found");\n    return await responseForSection(ctx, normalizeSection(section), {});'
          new = '    if (!section) throw new Error("Home section not found");\n    const normalized = normalizeSection(section);\n    const resolutionData = await loadResolutionData(ctx, [normalized]);\n    return await responseForSection(normalized, {}, resolutionData);'
          if old not in source: raise SystemExit('get target did not match')
          source = source.replace(old, new, 1)

          old = '''  rows.sort((a, b) => a.tab.localeCompare(b.tab) || (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
            const data = [];
            for (const section of rows.slice(offset, offset + limit)) {
              data.push({
                ...section,
                preview: await responseForSection(ctx, section, {}),
              });
            }
            return { data, total: rows.length, limit, offset };'''
          new = '''  rows.sort((a, b) => a.tab.localeCompare(b.tab) || (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
            const page = rows.slice(offset, offset + limit);
            const resolutionData = await loadResolutionData(ctx, page);
            const data = [];
            for (const section of page) {
              data.push({
                ...section,
                preview: await responseForSection(section, {}, resolutionData),
              });
            }
            return { data, total: rows.length, limit, offset };'''
          if old not in source: raise SystemExit('adminList target did not match')
          source = source.replace(old, new, 1)

          if 'responseForSection(ctx' in source:
            raise SystemExit('stale responseForSection call remains')
          path.write_text(source)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/apply-home-sections-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add convex/homeSections.ts .github/workflows/apply-home-sections-fix.yml
          git commit -m "fix: eliminate home section read amplification"
          git push origin HEAD:fix/home-sections-read-amplification
