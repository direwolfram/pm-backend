name: Apply five backend fixes

on:
  push:
    branches: [direwolfram/fix-from-clickup]
    paths: [scripts/apply-five-backend-fixes.mjs]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-five-backend-fixes.mjs
      - run: npm install -g npm@latest
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name "direwolfram"
          git config user.email "38549123+direwolfram@users.noreply.github.com"
          git add convex tests .github/workflows/apply-five-backend-fixes.yml scripts/apply-five-backend-fixes.mjs
          git commit -m "fix: close five backend integrity and scale issues"
          git push
